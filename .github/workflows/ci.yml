name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      # El build corre sin backend a proposito: las paginas deben degradar
      # con elegancia si el API no responde, no romper el despliegue.
      - name: Build de produccion
        run: npm run build
